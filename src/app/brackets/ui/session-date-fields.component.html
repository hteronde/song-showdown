        <div class="session-list"><div class="session-row" *ngFor="let session of sessions">
          <div><strong>Week {{ session.weekNumber }}</strong><small>{{ session.roundName }} · {{ session.matchupCount }} {{ session.matchupCount === 1 ? 'matchup' : 'matchups' }}</small><small>{{ session.state }}</small></div>
          <label>Starts<input type="datetime-local" step="1" [name]="'session-start-' + session.weekId" [(ngModel)]="session.startInput" [disabled]="saving || !!session.startLocked" [attr.aria-label]="'Week ' + session.weekNumber + ' start'"><small *ngIf="!session.startInput && noTimer">After the previous session</small></label>
          <label>Ends<input type="datetime-local" step="1" [name]="'session-end-' + session.weekId" [(ngModel)]="session.endInput" [disabled]="saving || !!session.endLocked" [attr.aria-label]="'Week ' + session.weekNumber + ' end'"><small *ngIf="!session.endInput && noTimer">No timer</small></label>
        </div></div>
